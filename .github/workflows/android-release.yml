# Builds a signed Crate APK on every push to main and attaches it to a GitHub Release.
# On your phone, open https://github.com/<you>/<repo>/releases/latest and tap crate.apk.
#
# Needs four repository secrets (Settings → Secrets and variables → Actions):
#   CRATE_KEYSTORE_BASE64    your release keystore file, base64-encoded
#   CRATE_KEYSTORE_PASSWORD  the keystore password
#   CRATE_KEY_ALIAS          the key alias (e.g. crate)
#   CRATE_KEY_PASSWORD       the key password
# See README.md → "Automatic builds with GitHub Actions".

name: Android release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # to create releases

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Build web app
        run: npm run build

      - name: Copy web app into the Android project
        run: npx cap sync android

      - name: Restore signing key
        env:
          CRATE_KEYSTORE_BASE64: ${{ secrets.CRATE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$CRATE_KEYSTORE_BASE64" ]; then
            echo "::error::The CRATE_KEYSTORE_BASE64 secret is missing. See README.md, 'Automatic builds with GitHub Actions'."
            exit 1
          fi
          echo "$CRATE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/crate-release.jks"

      - name: Build signed release APK
        working-directory: android
        env:
          CRATE_KEYSTORE_PATH: ${{ runner.temp }}/crate-release.jks
          CRATE_KEYSTORE_PASSWORD: ${{ secrets.CRATE_KEYSTORE_PASSWORD }}
          CRATE_KEY_ALIAS: ${{ secrets.CRATE_KEY_ALIAS }}
          CRATE_KEY_PASSWORD: ${{ secrets.CRATE_KEY_PASSWORD }}
          CRATE_VERSION_CODE: ${{ github.run_number }}
          CRATE_VERSION_NAME: ${{ env.VERSION }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Check the APK is signed
        run: |
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          "$APKSIGNER" verify --print-certs android/app/build/outputs/apk/release/app-release.apk
          cp android/app/build/outputs/apk/release/app-release.apk crate.apk

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/crate-release.jks"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" crate.apk \
            --target "$GITHUB_SHA" \
            --title "Crate $VERSION" \
            --notes "Built from ${GITHUB_SHA::7}. On your phone, download crate.apk and open it to install or update."
